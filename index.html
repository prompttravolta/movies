        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap');
        :root{
          --bg: #0b0b0d;
          --panel: #161619;
          --card: #1c1c20;
          --red: #c8102e;
          --gold: #d4af37;
          --text: #f2f0ea;
          --muted: #8a8a8f;
          --border: #2a2a2f;
        }
        *{ box-sizing: border-box; }
        html,body{ margin:0; padding:0; }
        body{
          background: var(--bg);
          color: var(--text);
          font-family: 'Inter', system-ui, sans-serif;
          min-height: 100vh;
          -webkit-user-select: none;
          -moz-user-select: none;
          user-select: none;
        }
        .mi-cine-root input, .mi-cine-root textarea{
          -webkit-user-select: text;
          -moz-user-select: text;
          user-select: text;
        }
        .mi-cine-root img{ -webkit-user-drag: none; user-drag: none; pointer-events: none; }

        header{
          position: sticky;
          top: 0;
          z-index: 100;
          padding: 14px 20px 12px;
          text-align: center;
          background:
            repeating-linear-gradient(90deg, var(--border) 0 2px, transparent 2px 18px) top / 100% 6px no-repeat,
            repeating-linear-gradient(90deg, var(--border) 0 2px, transparent 2px 18px) bottom / 100% 6px no-repeat;
          background-color: var(--bg);
          border-bottom: 1px solid var(--border);
        }
        header h1{
          font-family: 'Bebas Neue', sans-serif;
          font-size: clamp(2.2rem, 5vw, 3.2rem);
          line-height: 1;
          margin: 0;
          letter-spacing: 4px;
          color: var(--text);
          cursor: pointer;
        }
        header h1 span{ color: var(--red); }
        header p{
          margin: 6px 0 0;
          color: var(--muted);
          font-size: 0.85rem;
          letter-spacing: 2px;
          text-transform: uppercase;
        }
        #searchBox{
          margin-top: 10px;
          width: min(420px, 90%);
          padding: 9px 16px;
          border-radius: 999px;
          border: 1px solid var(--border);
          background: var(--panel);
          color: var(--text);
          font-size: 0.95rem;
          outline: none;
        }
        #searchBox:focus{ border-color: var(--gold); }

        main{ padding: 20px clamp(12px, 3vw, 32px) 60px; }
        #grid{
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 12px;
        }
        @media (min-width: 480px){ #grid{ grid-template-columns: repeat(3, 1fr); gap: 14px; } }
        @media (min-width: 900px){ #grid{ grid-template-columns: repeat(5, 1fr); gap: 16px; } }
        @media (min-width: 1280px){ #grid{ grid-template-columns: repeat(6, 1fr); gap: 18px; } }

        #pagination{
          display: none;
          align-items: center;
          justify-content: center;
          gap: 16px;
          margin-top: 30px;
        }
        #pagination.show{ display: flex; }
        #pagination button{
          background: var(--panel);
          border: 1px solid var(--border);
          color: var(--text);
          padding: 8px 16px;
          border-radius: 6px;
          font-size: 0.85rem;
          font-weight: 600;
          cursor: pointer;
        }
        #pagination button:hover:not(:disabled){ border-color: var(--gold); }
        #pagination button:disabled{ opacity: .35; cursor: default; }
        #pageLabel{ font-size: 0.85rem; color: var(--muted); letter-spacing: .5px; }

        .card{
          position: relative;
          background: var(--card);
          border: 1px solid var(--border);
          border-radius: 10px;
          overflow: hidden;
          cursor: pointer;
          transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
        }
        .card:hover, .card:focus-within{
          transform: translateY(-4px);
          border-color: var(--gold);
          box-shadow: 0 10px 24px rgba(0,0,0,.5);
        }
        .poster-wrap{
          position: relative;
          aspect-ratio: 2/3;
          background: linear-gradient(160deg, #2a2a30, #141416);
          display:flex; align-items:center; justify-content:center;
          overflow: hidden;
        }
        .badges{
          position: absolute;
          left: 6px; right: 6px;
          bottom: 6px;
          display: flex; flex-direction: column; gap: 4px;
          align-items: flex-start;
          z-index: 2;
        }
        .badges.has-progress{ bottom: 26px; }
        .badge{
          background: rgba(11,11,13,.5);
          backdrop-filter: blur(3px);
          -webkit-backdrop-filter: blur(3px);
          border: 1px solid rgba(212,175,55,.75);
          color: var(--gold);
          font-size: 0.62rem;
          font-weight: 700;
          letter-spacing: .5px;
          padding: 2px 6px;
          border-radius: 4px;
          line-height: 1.4;
        }
        .progress-badge{
          position: absolute;
          bottom: 0; left: 0; right: 0;
          background: rgba(11,11,13,.85);
          color: var(--muted);
          font-size: 0.62rem;
          padding: 3px 6px;
          text-align: center;
          z-index: 2;
        }
        .poster-wrap img{
          width: 100%; height: 100%; object-fit: cover; display:block;
          pointer-events: none;
        }
        .poster-fallback{
          font-family: 'Bebas Neue', sans-serif;
          font-size: 2.2rem;
          color: var(--muted);
          letter-spacing: 2px;
          text-align: center;
          padding: 0 10px;
          line-height: 1;
        }
        .card-title{
          padding: 8px 9px 10px;
          font-size: 0.84rem;
          font-weight: 600;
          line-height: 1.25;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;
        }
        .overlay{
          position: absolute; inset: 0;
          background: linear-gradient(180deg, rgba(11,11,13,0) 55%, rgba(11,11,13,.9) 100%);
          display: flex; align-items: flex-end; justify-content: center;
          padding: 10px;
          opacity: 0;
          transition: opacity .2s ease;
          pointer-events: none;
        }
        .card:hover .overlay, .card:focus-within .overlay{ opacity: 1; }
        .overlay-hint{
          font-size: 0.72rem;
          color: var(--text);
          letter-spacing: .5px;
          font-weight: 600;
        }
        .play-btn{
          background: var(--red);
          color: #fff;
          border: none;
          padding: 10px 20px;
          border-radius: 6px;
          font-size: 0.9rem;
          font-weight: 700;
          cursor: pointer;
          letter-spacing: .5px;
        }
        .play-btn:hover{ background: #a30d24; }

        #emptyMsg{
          display:none;
          text-align:center;
          color: var(--muted);
          padding: 60px 20px;
          font-size: 0.95rem;
        }

        /* Detalle CORREGIDO */
        #detailView{
          position: fixed; inset: 0;
          background: var(--bg);
          display: none;
          z-index: 550;
          overflow-y: auto;
        }
        #detailView.open{ display: block; }
        .detail-box{
          position: relative;
          min-height: 100%;
          width: 100%;
        }
        .detail-poster-wrap{
          position: relative;
          width: 100%;
          max-height: 68vh;
          background: #0e0e10;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          border-bottom: 1px solid var(--border);
        }
        .detail-poster-wrap img{
          width: auto;
          height: auto;
          max-width: 100%;
          max-height: 68vh;
          object-fit: contain;
          display: block;
          pointer-events: none;
        }
        @media (min-width: 768px){
          .detail-poster-wrap{ max-height: 62vh; }
          .detail-poster-wrap img{ max-height: 62vh; max-width: 520px; }
        }
        .detail-badges{ position: absolute; bottom: 12px; left: 16px; display:flex; flex-direction:column; gap:6px; }
        .detail-body{
          padding: 26px clamp(16px, 5vw, 64px) 80px;
          max-width: 900px;
          margin: 0 auto;
        }
        .detail-body h2{
          font-family: 'Bebas Neue', sans-serif;
          letter-spacing: 2px;
          font-size: clamp(1.8rem, 4vw, 2.6rem);
          margin: 18px 0 10px;
          -webkit-user-select: text; user-select: text;
        }
        .detail-desc{
          color: var(--muted);
          font-size: 0.98rem;
          line-height: 1.7;
          white-space: pre-line;
          margin-bottom: 24px;
          -webkit-user-select: text; user-select: text;
        }
        .detail-progress{
          font-size: 0.82rem;
          color: var(--gold);
          margin-bottom: 12px;
        }
        #closeDetail{
          position: fixed;
          top: 16px; right: 18px;
          background: rgba(11,11,13,.75);
          backdrop-filter: blur(6px);
          -webkit-backdrop-filter: blur(6px);
          border: 1px solid var(--border);
          color: var(--text);
          font-size: 1.9rem;
          line-height: 1;
          cursor: pointer;
          z-index: 3;
          border-radius: 50%;
          width: 40px; height: 40px;
        }
        .player-banner{
          width: min(1000px, 100%);
          color: var(--gold);
          font-size: 0.8rem;
          text-align: center;
          margin-bottom: 8px;
          min-height: 18px;
        }

        #trailerModal{
          position: fixed; inset: 0;
          background: rgba(0,0,0,.95);
          display: none;
          align-items: center; justify-content: center;
          z-index: 650;
          padding: 20px;

        .detail-actions{ display:flex; gap: 10px; flex-wrap: wrap; }
        .trailer-btn{
          background: transparent;
          border: 1px solid var(--gold);
          color: var(--gold);
          padding: 10px 20px;
          border-radius: 6px;
          font-size: 0.9rem;
          font-weight: 700;
          letter-spacing: .5px;
          cursor: pointer;
        }
        .trailer-btn:hover{ background: rgba(212,175,55,.12); }

        #playerModal{
          position: fixed; inset: 0;
          background: rgba(0,0,0,.95);
          display: none;
          align-items: center; justify-content: center;
          flex-direction: column;
          z-index: 650;
          padding: 20px;
        }
        #playerModal.open{ display: flex; }
        #playerFrame{
          width: min(1400px, 96vw);
          max-height: 85vh;
          aspect-ratio: 16/9;
          background: #000;
          border-radius: 6px;
          overflow: hidden;
        }
        #playerFrame iframe{ width:100%; height:100%; border:0; }
        #closePlayer{
          position: absolute;
          top: 18px; right: 24px;
          background: none; border: none;
          color: var(--text); font-size: 2rem;
          cursor: pointer; line-height: 1;
        }

        #adminPanel{
          position: fixed; inset: 0;

          padding: 30px 16px;
          overflow-y: auto;
        }
        #adminPanel.open{ display: flex; }
        .admin-box{
          background: var(--panel);
          border: 1px solid var(--gold);
          border-radius: 10px;
          width: min(560px, 100%);
          padding: 24px;
        }
        .admin-box h2{
          font-family: 'Bebas Neue', sans-serif;
          letter-spacing: 2px;
          color: var(--gold);
          margin: 0 0 4px;
          font-size: 1.6rem;
        }
        .admin-box .hint{ color: var(--muted); font-size: 0.78rem; margin-bottom: 18px; }
        .admin-box label{
          display:block; font-size: 0.78rem; color: var(--muted);
          margin: 14px 0 5px; text-transform: uppercase; letter-spacing: .5px;
        }
        .admin-box input, .admin-box textarea{
          width: 100%;
          background: #101012;
          border: 1px solid var(--border);
          border-radius: 6px;
          color: var(--text);
          padding: 9px 11px;
          font-family: inherit;
          font-size: 0.88rem;
          resize: vertical;
        }
        .admin-box textarea{ min-height: 70px; }
        .admin-actions{ display:flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
        .btn{
          padding: 9px 16px;
          border-radius: 6px;
          border: none;
          font-weight: 700;
          font-size: 0.85rem;
          cursor: pointer;
        }
        .btn-primary{ background: var(--red); color:#fff; }
        .btn-primary:hover{ background: #a30d24; }
        .btn-secondary{ background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-secondary:hover{ border-color: var(--gold); }
        .btn-close{ margin-left:auto; }

        .admin-list{ margin-top: 22px; border-top: 1px solid var(--border); padding-top: 14px; }

        .admin-item{
          display: flex; align-items: center; justify-content: space-between;

        }

          background: none; border: 1px solid var(--red); color: var(--red);

        }
        .admin-item button:hover{ background: var(--red); color: #fff; }
        .admin-item button.gold{
          border-color: var(--gold);

        }
        .admin-item button.gold:hover{ background: var(--gold); color: #000; }
        .admin-item button:disabled{ opacity: .35; }
        #importFile{ display:none; }
