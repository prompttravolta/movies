        return it.data.name.toLowerCase().includes(qq) || it.data.movies.some(mm=>mm.title.toLowerCase().includes(qq));
      });
    }
    return items;
  },[standaloneMovies, collectionsList, q]);

            React.createElement("div",{key:"w", className:"poster-wrap"},[

              p.collectionId? React.createElement("div",{key:"cb", className:"badge"}, "SAGA") : null

          ])
        }
