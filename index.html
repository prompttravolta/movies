header{position:sticky;top:0;z-index:100;padding:14px 16px;text-align:center;background:rgba(11,11,13,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}

#detailView,#playerModal,#trailerModal{position:fixed;inset:0;background:rgba(0,0,0,.96);display:none;z-index:600;padding:20px}#detailView.open,#playerModal.open,#trailerModal.open{display:flex;align-items:center;justify-content:center}
#detailView.open{display:block;overflow:auto;background:var(--bg)}
#adminPanel{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;z-index:800;overflow:auto;padding:20px}#adminPanel.open{display:flex;justify-content:center}
.admin-box{background:var(--panel);border:1px solid var(--gold);border-radius:12px;width:min(700px,100%);padding:22px}

.btn{padding:9px 16px;border-radius:8px;border:none;font-weight:700;cursor:pointer;font-size:.85rem}.btn-p{background:var(--red);color:#fff}.btn-s{background:transparent;border:1px solid var(--border);color:#fff}
.admin-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--border);font-size:.85rem}

#importFile{display:none}
.detail-meta{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px}

img.emoji{height:1em;width:1em;margin:0 .05em 0 .1em;vertical-align:-0.15em;display:inline-block}
#adModal{position:fixed;inset:0;background:rgba(0,0,0,.85);backdrop-filter:blur(8px);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}
#adModal.open{display:flex}
.ad-box{background:#161619;border:1px solid #2a2a2f;border-radius:16px;width:min(480px,100%);padding:28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}

.ad-box .highlight{color:var(--text);background:var(--card);border:1px solid var(--border);padding:10px 14px;border-radius:8px;font-size:.85rem;margin-bottom:18px}
.empty-state{text-align:center;color:var(--muted);padding:40px 20px;grid-column:1/-1}
.pagination{display:flex;justify-content:center;align-items:center;gap:6px;margin:24px 10px;flex-wrap:wrap}.page-num{min-width:36px;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:var(--muted);font-weight:800;cursor:pointer}.page-num.active{background:var(--red);color:#fff;border-color:var(--red)}.page-arrow{width:90px;height:36px;border-radius:999px;border:1px solid var(--border);background:var(--panel);color:#fff;font-weight:800;cursor:pointer;font-size:.8rem}.page-arrow:disabled{opacity:.3}
</style>

<body>
<div id="root"></div>
<script src="https://twemoji.maxcdn.com/v/latest/twemoji.min.js" crossorigin="anonymous"></script>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script>
const e = React.createElement;
const KEY="miCine.movies";
/* ===== VOZ LATINA (ResponsiveVoice) =====
   Pega aquí tu clave gratuita entre las comillas. Ejemplo: const RV_KEY="AbCdEfGh";
   Si la dejas vacía, la página usa el sistema anterior. */
const RV_KEY="";
function getColumns(){
  const w=window.innerWidth; 
  if(w>=1280) return 6;
  if(w>=1024) return 5; 
  if(w>=768)  return 4; 
  if(w>=600)  return 3; 
  return 2;
}
function getPerPage(){
  const w=window.innerWidth; 
  if(w>=1280) return 30;
  if(w>=1024) return 25;
  if(w>=768)  return 20;
  if(w>=600)  return 18;
  return 18;
}
function getPaginationRange(current,total,maxVisible){maxVisible=maxVisible||10;let start=Math.max(1,current-Math.floor(maxVisible/2));let end=start+maxVisible-1;if(end>total){end=total;start=Math.max(1,end-maxVisible+1);}const r=[];for(let i=start;i<=end;i++)r.push(i);return r;}
const ALPHABET = [..."ABCDEFGHIJKLMNOPQRSTUVWXYZ", "#"];
function normalize(s){return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();}
const FX_KEYS=["label","label2","label3","label4","embed2","embed3","embed4"];
function App(){
  const [movies,setMovies]=React.useState([]);
  const [q,setQ]=React.useState("");
  const [page,setPage]=React.useState(1);
  const [detail,setDetail]=React.useState(null);
  const [player,setPlayer]=React.useState(null);
  const [trailer,setTrailer]=React.useState(null);
  const [admin,setAdmin]=React.useState(false);
  const [editId,setEditId]=React.useState(null);
  const [selectedSaga,setSelectedSaga]=React.useState(null);
  const [msg,setMsg]=React.useState("");
  const [letter,setLetter]=React.useState(null);
  const [typeFilter,setTypeFilter]=React.useState("todos");
  const [showAd,setShowAd]=React.useState(false);
  const clicks=React.useRef(0); const detailPosterClicks=React.useRef(0); const xClicks=React.useRef(0); const fileRef=React.useRef(null);
  const [fTitle,setFTitle]=React.useState(""); const [fPoster,setFPoster]=React.useState(""); const [fDesc,setFDesc]=React.useState("");
  const [fEmbed,setFEmbed]=React.useState(""); const [fLang,setFLang]=React.useState(""); const [fLang2,setFLang2]=React.useState("");
  const [fSubs,setFSubs]=React.useState(""); const [fTrailer,setFTrailer]=React.useState("");
  const [fTipo,setFTipo]=React.useState("pelicula");
  const [fSagaId,setFSagaId]=React.useState(""); const [fSagaName,setFSagaName]=React.useState("");
  const [fSagaPoster,setFSagaPoster]=React.useState(""); const [fOrder,setFOrder]=React.useState("");
  const [fTags,setFTags]=React.useState("");
  /* ===== NUEVO: audios extra ===== */
  const [fx,setFx]=React.useState({});
  const setX=(k,v)=>setFx(p=>({...p,[k]:v}));
  const loadFx=m=>setFx({label:m.label||"",label2:m.label2||"",label3:m.label3||"",label4:m.label4||"",embed2:m.embed2||"",embed3:m.embed3||"",embed4:m.embed4||""});
  /* ===== NUEVO: leer sinopsis en voz alta ===== */
  const speakOk=typeof window!=="undefined";
  const [speaking,setSpeaking]=React.useState(false);
  const vozTipo="es-MX";
  const esList=()=>{ try{ return (speechSynthesis.getVoices()||[]).filter(v=>v.lang.toLowerCase().startsWith("es")); }catch{ return []; } };
  const pickVoice=()=>{ try{
    const all=esList();
    const norm=v=>v.lang.replace("_","-").toLowerCase();
    const orden=["es-mx","es-us","es-419","es-co","es-ar","es-cl","es-pe","es-ve","es-ec","es-gt","es-cu","es-bo","es-do","es-hn","es-ni","es-pa","es-pr","es-py","es-sv","es-uy","es-cr"];
    for(const c of orden){ const v=all.find(x=>norm(x)===c); if(v) return v; }
    const porNombre=all.find(x=>/mexic|méxic|estados unidos|united states|latin|latam|colomb|argent|chile|peru|perú/i.test(x.name) && !/spain|españa|espa[nñ]a/i.test(x.name));
    return porNombre||null;
  }catch{ return null; } };
  React.useEffect(()=>{ try{ speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices(); }catch{} },[]);
  const audioRef=React.useRef(null);
  const stopSpeak=()=>{try{if(window.responsiveVoice) responsiveVoice.cancel();}catch{} try{speechSynthesis.cancel();}catch{} try{ if(audioRef.current){ const a=audioRef.current; audioRef.current=null; a.onended=null; a.onerror=null; a.pause(); } }catch{} setSpeaking(false);};
  const chunkText=(t)=>{
    const sents=((t||"").match(/[^.!?\n]+[.!?]*/g)||[]).map(s=>s.trim()).filter(Boolean);
    const out=[]; let cur="";
    const push=()=>{ if(cur.trim()) out.push(cur.trim()); cur=""; };
    sents.forEach(s=>{
      if(s.length>180){ push(); s.split(/(?<=,)\s+|\s+/).forEach(w=>{ if((cur+" "+w).length>180) push(); cur+=(cur?" ":"")+w; }); push(); }
      else if((cur+" "+s).length>180){ push(); cur=s; }
      else cur+=(cur?" ":"")+s;
    });
    push(); return out;
  };
  const speakLocal=(parts)=>{
    const vv=pickVoice();
    speechSynthesis.cancel();
    parts.forEach((p,i)=>{
      const u=new SpeechSynthesisUtterance(p); u.lang=vozTipo; u.rate=.95; if(vv) u.voice=vv;
      if(i===parts.length-1) u.onend=()=>setSpeaking(false);
      u.onerror=()=>setSpeaking(false);
      speechSynthesis.speak(u);
    });
    setSpeaking(true);
  };
  const [vozInfo,setVozInfo]=React.useState("");
  const TTS_SRC=[
    q=>"https://translate.google.com.mx/translate_tts?ie=UTF-8&client=tw-ob&tl=es&q="+q,
    q=>"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es-US&q="+q,
    q=>"https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=es-MX&q="+q
  ];
  const speakOnline=(parts)=>{
    let i=0, src=-1; const tok={};
    audioRef.current=tok;
    const fallback=()=>{ if(audioRef.current!==tok&&audioRef.current!==null&&audioRef.current.__tok!==tok) return; audioRef.current=null; { const l=esList().map(v=>v.lang).filter((x,i,arr)=>arr.indexOf(x)===i).join(", "); setVozInfo("Voz del dispositivo. Idiomas en español que trae tu aparato: "+(l||"ninguno")+". No hay voz latina.") } try{ speakLocal(parts); }catch{ setSpeaking(false); } };
    const play=(si)=>{
      if(audioRef.current!==tok&&!(audioRef.current&&audioRef.current.__tok===tok)) return;
      if(i>=parts.length){ audioRef.current=null; setSpeaking(false); return; }
      const a=new Audio(TTS_SRC[si](encodeURIComponent(parts[i])));
      audioRef.current=a; a.__tok=tok;
      a.onended=()=>{ i++; play(si); };
      const fail=()=>{
        if(audioRef.current!==a) return;
        if(i===0 && si+1<TTS_SRC.length){ play(si+1); }
        else if(i===0){ fallback(); }
        else { audioRef.current=null; setSpeaking(false); }
      };
      a.onerror=fail;
      a.play().then(()=>{ if(i===0) setVozInfo("Voz en línea (español latino)"); }).catch(fail);
    };
    setSpeaking(true); setVozInfo("Cargando voz…"); play(0);
  };
  const speak=(t)=>{
    if(speaking){stopSpeak();return;}
    const parts=chunkText(t);
    if(!parts.length) return;
    const go=()=>{
      if(RV_KEY && window.responsiveVoice){
        try{ responsiveVoice.cancel(); setVozInfo("Voz ResponsiveVoice (español latino)"); setSpeaking(true);
          responsiveVoice.speak(t,"Spanish Latin American Female",{rate:.95,onend:()=>setSpeaking(false),onerror:()=>setSpeaking(false)}); return; }catch{ setSpeaking(false); }
      }
      const vv=pickVoice();
      if(vv){ setVozInfo("Voz del dispositivo: "+vv.name+" ("+vv.lang+")"); speakLocal(parts); } else speakOnline(parts);
    };
    let total=0; try{ total=(speechSynthesis.getVoices()||[]).length; }catch{}
    if(total===0){ setVozInfo("Cargando voces…"); let n=0; const iv=setInterval(()=>{ n++; let c=0; try{ c=(speechSynthesis.getVoices()||[]).length; }catch{} if(c>0||n>15){ clearInterval(iv); go(); } },100); }
    else go();
  };
  React.useEffect(()=>{ if(!detail) stopSpeak(); },[detail]);
  React.useEffect(()=>{ if(RV_KEY && !window.responsiveVoice && !document.getElementById("rvScript")){ const sc=document.createElement("script"); sc.id="rvScript"; sc.src="https://code.responsivevoice.org/responsivevoice.js?key="+encodeURIComponent(RV_KEY); document.head.appendChild(sc); } },[]);
  /* ===== NUEVO: transmitir a TV / proyector ===== */
  const getSrc=s=>{s=(s||"").trim();const m=s.match(/src=["']([^"']+)/i);return m?m[1]:s;};
  const cast=async(url)=>{
    if(!window.PresentationRequest){alert("Tu navegador no permite transmitir desde la página. Usa el menú ⋮ → Transmitir.");return;}
    try{ await new PresentationRequest([getSrc(url)]).start(); }
    catch(err){ if(err&&err.name!=="NotAllowedError"&&err.name!=="AbortError") alert("No se pudo transmitir. Prueba con ⋮ → Transmitir pestaña."); }
  };
  /* ================================= */
  const loadFromGithub=async()=>{
    try{
      const r=await fetch("movies.json?v="+Date.now(),{cache:"no-store"});
      const d=await r.json();
      if(Array.isArray(d)&&d.length>0){
        const seen=new Set(); const fixed=d.map((m,i)=>{ if(seen.has(m.id)){ return {...m, id:m.id+"-"+i}; } seen.add(m.id); return m; });
        const norm = fixed.map(m=>{ if(!m.tipo){ if(m.collectionId) m.tipo = "coleccion"; else m.tipo = "pelicula"; } return m; });
        setMovies(norm); localStorage.setItem(KEY,JSON.stringify(norm));
        setMsg("Cargado desde Github ("+norm.length+")");
      }
    }catch{ try{const s=localStorage.getItem(KEY); if(s) setMovies(JSON.parse(s));}catch{} }
  };
  React.useEffect(()=>{loadFromGithub();},[]);
  React.useEffect(()=>{if(movies.length) localStorage.setItem(KEY,JSON.stringify(movies));},[movies]);
  React.useEffect(()=>{ if(window.twemoji){ window.twemoji.parse(document.body, {folder: 'svg', ext: '.svg'}); } },[movies,q,page,detail,selectedSaga,letter,typeFilter]);
  React.useEffect(()=>{ if(!sessionStorage.getItem('miCine_aviso')){ setShowAd(true); } },[]);
  const closeAd=()=>{ setShowAd(false); sessionStorage.setItem('miCine_aviso','1'); };
  const [perPage,setPerPage]=React.useState(getPerPage());
  React.useEffect(()=>{ const onR=()=>setPerPage(getPerPage()); window.addEventListener('resize',onR); return ()=>window.removeEventListener('resize',onR); },[]);
  const collectionsMap=React.useMemo(()=>{
    const map={};
    movies.forEach(m=>{
      if(m.collectionId){
        const id=m.collectionId.trim().toLowerCase().replace(/\s+/g,'-');
        if(!map[id]) map[id]={id, name:m.collection||id, poster:m.collectionPoster||m.poster, movies:[], tipo: m.tipo==="serie" ? "serie" : "coleccion"};
        if(m.collectionPoster) map[id].poster=m.collectionPoster;
        if(m.collection) map[id].name=m.collection;
        if(m.tipo==="serie") map[id].tipo="serie";
        map[id].movies.push(m);
      }
    });
    Object.values(map).forEach(c=>c.movies.sort((a,b)=>(a.order||0)-(b.order||0)));
    return map;
  },[movies]);
  const standalone=React.useMemo(()=>movies.filter(m=>!m.collectionId),[movies]);
  const sagas=React.useMemo(()=>Object.values(collectionsMap),[collectionsMap]);
  const handleVolver=()=>{ setSelectedSaga(null); setPage(1); window.scrollTo({top:0, behavior:"smooth"}); };
  let homeItems=[];
  if(!selectedSaga){
    if(typeFilter==="hentai" || typeFilter==="x"){
      movies.filter(m=>m.tipo===typeFilter).forEach(m=>homeItems.push({type:'movie', data:m}));
    } else {
      if(typeFilter==="todos" || typeFilter==="pelicula"){
        standalone.filter(m=>m.tipo==="pelicula").forEach(m=>homeItems.push({type:'movie', data:m}));
      }
      if(typeFilter==="todos" || typeFilter==="coleccion" || typeFilter==="serie"){
        sagas.forEach(s=>{
          if(typeFilter==="todos" || s.tipo===typeFilter) homeItems.push({type:'collection', data:s});
        });
      }
    }
    if(q.trim()){
      const qq=normalize(q);
      homeItems=homeItems.filter(it=>{
        if(it.type==='movie'){
          const m=it.data;
          return [m.title,m.desc,m.collection,m.lang,m.lang2,m.subs,m.tags].filter(Boolean).some(v=>normalize(v).includes(qq));
        }
        const c=it.data;
        return [c.name,c.id].filter(Boolean).some(v=>normalize(v).includes(qq)) || c.movies.some(m=>[m.title,m.desc,m.collection,m.tags].filter(Boolean).some(v=>normalize(v).includes(qq)));
      });
    }
    if(letter){
      homeItems=homeItems.filter(it=>{
        const name = it.type==='movie' ? it.data.title : it.data.name;
        const first = name.trim().charAt(0).toUpperCase();
        if(letter==="#") return !/[A-Z]/.test(first);
        return first===letter;
      });
    }
    homeItems.sort((a,b)=>{
      const na = (a.type==='movie'? a.data.title : a.data.name).toLowerCase();
      const nb = (b.type==='movie'? b.data.title : b.data.name).toLowerCase();
      return na.localeCompare(nb);
    });
  } else {
    const col=collectionsMap[selectedSaga];
    if(col) homeItems=col.movies.map(m=>({type:'movie', data:m}));
  }
  const totalPages=Math.max(1,Math.ceil(homeItems.length/perPage));
  const paginated=selectedSaga? homeItems : homeItems.slice((page-1)*perPage, page*perPage);
  React.useEffect(()=>{ if(page>totalPages) setPage(1); },[totalPages]);
  const openEditFromCard=(m)=>{loadFx(m);setEditId(m.id);setFTitle(m.title);setFPoster(m.poster||'');setFDesc(m.desc||'');setFEmbed(m.embed||'');setFLang(m.lang||'');setFLang2(m.lang2||'');setFSubs(m.subs||'');setFTrailer(m.trailer||'');setFTags(m.tags||'');setFTipo(m.tipo||'pelicula');setFSagaId(m.collectionId||'');setFSagaName(m.collection||'');setFSagaPoster(m.collectionPoster||'');setFOrder(m.order||'');setAdmin(true);setMsg('Editando: '+m.title);};
